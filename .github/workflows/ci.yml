name: Validaciones
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_analysis_quality.py
      # El motor mide RSS del proceso pytest + hijo. Los escenarios SDK se
      # ejecutan en otro intérprete para no cargar sus cachés en esa medición.
      # Ambos bloques son obligatorios: no se omite ninguna prueba.
      - name: Probar aplicación y motor estadístico
        run: python -m pytest -q --ignore=tests/test_gemini_diagnostic.py --ignore=tests/test_gemini_resilience.py
      - name: Probar SDK y diagnóstico Gemini sin red
        run: python -m pytest -q tests/test_gemini_diagnostic.py tests/test_gemini_resilience.py
      - run: python -m pip check
      - name: Medir memoria del análisis en Linux
        run: python scripts/measure_analysis_memory.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:deployment
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - run: npm test
