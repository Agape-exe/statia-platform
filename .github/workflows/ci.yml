name: Validaciones
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Reproducción del backend histórico real para verificar rollback.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci --prefix ../supabase
      - run: python scripts/check_analysis_quality.py
      # La barrera RSS incluye el proceso pytest. Aislar cada módulo evita
      # acumular objetos/importaciones de otros escenarios en esa medición.
      # Todos los módulos son obligatorios; no se omiten ni repiten fallos.
      - name: Probar todos los módulos backend en procesos aislados
        run: |
          for test_module in tests/test_*.py; do
            python -m pytest -q "$test_module"
          done
      - run: python -m pip check
      - name: Medir memoria del análisis en Linux
        run: python scripts/measure_analysis_memory.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:deployment
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - run: npm test
